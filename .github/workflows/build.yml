name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython

    - name: Accept Android SDK Licenses Automatically
      run: |
        # تثبيت وتفعيل رخص أدوات أندرويد بشكل قسري لمنع توقف البناء
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        # استخدام أداة sdkmanager للموافقة على التراخيص إذا كانت متوفرة، أو إنشاء ملفات القبول يدوياً
        yes | sdkmanager --licenses || true
      shell: bash

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnakeGame-APK
        path: bin/*.apk
